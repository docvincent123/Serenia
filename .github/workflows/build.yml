name: SOLVIA • React desktop build and security tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install React dependencies
        shell: pwsh
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build React interface
        shell: pwsh
        working-directory: frontend
        run: |
          npm run build
          if (!(Test-Path dist/index.html)) { throw 'React build did not produce index.html' }

      - uses: actions/cache/restore@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: solvia-vcpkg-react-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      - name: Configure C++20 server and WebView2 shell
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-solvia -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets" -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - uses: actions/cache/save@v4
        with:
          path: C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: solvia-vcpkg-react-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*') }}

      - name: Build native executables
        run: cmake --build build --config Release --parallel

      - name: Test API scenario and role isolation
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage React UI beside desktop executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Release/ui | Out-Null
          Copy-Item frontend/dist/* build/Release/ui/ -Recurse -Force

      - name: Smoke-test WebView2 desktop shell
        shell: pwsh
        run: ./tests/windows-ui.ps1 -BuildDir build/Release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOLVIA-react-UI-check
          path: out/ui/
          if-no-files-found: ignore

      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/SOLVIA | Out-Null
          Copy-Item build/Release/Solvia.exe,build/Release/SolviaServer.exe out/SOLVIA/
          Copy-Item build/Release/ui out/SOLVIA/ -Recurse
          Copy-Item scripts/*.bat out/SOLVIA/
          Copy-Item README.md out/SOLVIA/
          Copy-Item docs out/SOLVIA/ -Recurse
          New-Item -ItemType Directory -Force out/SOLVIA/licenses | Out-Null
          Get-ChildItem build/vcpkg_installed/x64-windows-solvia/share -Filter copyright -Recurse | ForEach-Object {
            Copy-Item $_.FullName ("out/SOLVIA/licenses/" + $_.Directory.Name + ".txt")
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SOLVIA-0.2.0-Windows-x64
          path: out/SOLVIA/
          retention-days: 14
