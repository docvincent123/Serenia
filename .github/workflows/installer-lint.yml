name: SOLVIA installer PowerShell lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem installer/*.ps1 | ForEach-Object {
            $file = $_
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) {
              $failed = $true
              Write-Host ("{0}:{1}:{2} {3}" -f $file.Name, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
            }
          }
          if ($failed) { throw 'Installer PowerShell syntax validation failed' }

      - name: Installer regression tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/installer.ps1
      - name: Compile wizard with fixture payload
        shell: powershell
        run: |
          node tools/materialize-brand.cjs
          if (!(Test-Path assets/solvia.ico)) { throw 'SOLVIA installer icon was not materialized' }
          New-Item -ItemType Directory -Force out/SOLVIA | Out-Null
          Set-Content out/SOLVIA/fixture.txt 'Compiler fixture only; not an installer release'
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/SOLVIA.iss
          if ($LASTEXITCODE -ne 0) { throw 'Wizard compilation failed' }


      - name: Check API startup health on Windows PowerShell 5.1
        shell: powershell
        timeout-minutes: 2
        run: ./tests/startup-health.ps1
