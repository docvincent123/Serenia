name: Lemvori Care independent Linux server
on:
  pull_request:
    paths:
      - 'deploy/lemvori-care/**'
      - 'src/server/main.cpp'
      - 'tests/lemvori-care-network.py'
      - '.github/workflows/lemvori-care-server.yml'
  workflow_dispatch:

jobs:
  server-deployment-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer and network scripts
        run: |
          bash -n deploy/lemvori-care/install.sh
          bash -n deploy/lemvori-care/network-tls.sh
          bash -n deploy/lemvori-care/lemvori-carectl
          bash -n deploy/lemvori-care/restore.sh
          bash -n tests/lemvori-restore-e2e.sh
          python3 -m py_compile deploy/lemvori-care/network-address.py
          python3 tests/lemvori-care-network.py
      - name: Verify live network selection and stable local CA
        run: |
          sudo useradd --system --user-group --home-dir /var/lib/lemvori-care \
            --shell /usr/sbin/nologin lemvori-care
          sudo install -d -m 0755 /opt/lemvori-care
          sudo install -m 0755 deploy/lemvori-care/network-address.py \
            deploy/lemvori-care/network-tls.sh /opt/lemvori-care/
          sudo /opt/lemvori-care/network-tls.sh --no-restart
          lan_ip=$(sudo cat /etc/lemvori-care/address)
          sudo openssl verify -CAfile /etc/lemvori-care/ca/ca.crt \
            -verify_ip "$lan_ip" /etc/lemvori-care/tls/server.crt
          sudo openssl verify -CAfile /etc/lemvori-care/ca/ca.crt \
            -verify_hostname localhost /etc/lemvori-care/tls/server.crt
          before=$(sudo openssl x509 -in /etc/lemvori-care/ca/ca.crt -noout -fingerprint -sha256)
          sudo /opt/lemvori-care/network-tls.sh --no-restart
          after=$(sudo openssl x509 -in /etc/lemvori-care/ca/ca.crt -noout -fingerprint -sha256)
          test "$before" = "$after"
      - name: Build the actual C++ server for Qt Native
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpq-dev libssl-dev \
            nlohmann-json3-dev libcpp-httplib-dev
          cmake -S . -B build/lemvori-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/lemvori-ci --target SolviaServer --parallel 2
          test -x build/lemvori-ci/SolviaServer

      - name: Exercise fresh PostgreSQL init and HTTPS API
        env:
          CI_PG_PASSWORD: local-ci-password-only
          LEMVORI_ADMIN_LOGIN: admin
          LEMVORI_ADMIN_NAME: CI Administrator
          LEMVORI_ADMIN_PASSWORD: CI-admin-password-12345
        run: |
          sudo apt-get install -y postgresql-16
          sudo pg_ctlcluster 16 main start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE lemvori_app LOGIN PASSWORD 'local-ci-password-only'"
          sudo -u postgres createdb -O lemvori_app lemvori_core
          export LEMVORI_DATABASE_URL="host=127.0.0.1 port=5432 dbname=lemvori_core user=lemvori_app password=$CI_PG_PASSWORD"
          build/lemvori-ci/SolviaServer --init
          mkdir -p "$RUNNER_TEMP/lemvori-tls"
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/lemvori-tls/server.key" -out "$RUNNER_TEMP/lemvori-tls/server.crt"
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/license-private.pem"
          openssl pkey -in "$RUNNER_TEMP/license-private.pem" -pubout -out "$RUNNER_TEMP/license-public.pem"
          export LEMVORI_LICENSE_REQUIRED=1
          export LEMVORI_LICENSE_PUBLIC_KEY="$RUNNER_TEMP/license-public.pem"
          build/lemvori-ci/SolviaServer --host 127.0.0.1 --port 8443 \
            --cert "$RUNNER_TEMP/lemvori-tls/server.crt" \
            --key "$RUNNER_TEMP/lemvori-tls/server.key" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for _ in $(seq 1 20); do
            if curl --fail --silent --cacert "$RUNNER_TEMP/lemvori-tls/server.crt" \
                https://127.0.0.1:8443/api/health -o "$RUNNER_TEMP/health.json" 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          test "$ok" -eq 1
          python3 - "$RUNNER_TEMP/health.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data.get("ok") is True, data
          assert len(data.get("server_id","")) == 64, data
          print("Lemvori Care HTTPS /api/health OK")
          PY
          python3 - "$RUNNER_TEMP" <<'PYLICENSE'
          import datetime,json,os,pathlib,ssl,subprocess,sys,urllib.request
          tmp=pathlib.Path(sys.argv[1])
          base="https://127.0.0.1:8443"
          context=ssl.create_default_context(cafile=str(tmp/"lemvori-tls/server.crt"))
          def fetch(path,payload=None,token=""):
              headers={"Content-Type":"application/json"}
              if token:headers["Authorization"]="Bearer "+token
              data=None if payload is None else json.dumps(payload).encode()
              request=urllib.request.Request(base+path,data=data,headers=headers,
                method="GET" if payload is None else "POST")
              with urllib.request.urlopen(request,context=context,timeout=10) as resp:
                  return json.load(resp)
          sid=fetch("/api/health")["server_id"]
          user=fetch("/api/login",{"login":"admin","password":"CI-admin-password-12345","platform":"Desktop"})
          token=user["token"]
          before=fetch("/api/license",token=token)
          assert before["status"]=="activation_required",before
          issued=tmp/"signed-license.json"
          future=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(days=365)).isoformat()
          subprocess.run(["python3","tools/issue-center-license.py","--key",str(tmp/"license-private.pem"),
            "--server-id",sid,"--center","CI Лемворі Центр","--expires",future,
            "--output",str(issued)],check=True)
          activated=fetch("/api/license",json.loads(issued.read_text()),token)
          assert activated["status"]=="active",activated
          assert fetch("/api/license",token=token)["status"]=="active"
          info=fetch("/api/settings/center",token=token)
          assert info["center_name"]=="CI Лемворі Центр",info
          print("Lemvori signed license activated and persisted in PostgreSQL; center branding confirmed")
          PYLICENSE
      - name: Full PostgreSQL restore round-trip with live HTTPS
        run: bash tests/lemvori-restore-e2e.sh
