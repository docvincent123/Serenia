name: SOLVIA reception frontend checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/reception-ui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Build the React production interface
        run: npm --prefix frontend run build
