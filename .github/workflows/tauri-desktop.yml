name: Tauri 2 desktop smoke

on:
  pull_request:
    paths:
      - 'frontend/src-tauri/**'
      - 'frontend/src/request.mjs'
      - 'frontend/src/App.jsx'
      - 'frontend/src/DesktopUpdates.jsx'
      - 'frontend/package.json'
      - 'tests/tauri-transport.mjs'
      - '.github/workflows/tauri-desktop.yml'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux WebKit and TLS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Test transport and React build
        run: |
          npm ci --prefix frontend
          node tests/tauri-transport.mjs
          npm run build --prefix frontend
      - name: Check native Rust shell
        run: cargo check --manifest-path frontend/src-tauri/Cargo.toml
      - name: Run native security tests
        run: cargo test --manifest-path frontend/src-tauri/Cargo.toml --lib
