name: SOLVIA Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: solvia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOLVIA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SOLVIA_ANDROID_KEYSTORE_BASE64 }}
      SOLVIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SOLVIA_ANDROID_KEYSTORE_PASSWORD }}
      SOLVIA_ANDROID_KEY_ALIAS: ${{ secrets.SOLVIA_ANDROID_KEY_ALIAS }}
      SOLVIA_ANDROID_KEY_PASSWORD: ${{ secrets.SOLVIA_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Verify HTTPS default and private LAN HTTP restrictions
        run: python3 tests/mobile-security-config.py
      - name: Build SOLVIA test APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug :app:lintRelease
      - uses: actions/upload-artifact@v7
        with:
          name: SOLVIA-2.5.0-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: SOLVIA-2.5.0-Android-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SOLVIA-2.5.0-Android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore



      - name: Build consistently signed production APK
        if: github.event_name != 'pull_request' && env.SOLVIA_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        working-directory: android
        run: |
          umask 077
          signing_file="$RUNNER_TEMP/solvia-production.jks"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$SOLVIA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          export SOLVIA_ANDROID_KEYSTORE_PATH="$signing_file"
          gradle --no-daemon :app:assembleRelease :app:lintRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && env.SOLVIA_ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: SOLVIA-2.5.0-Android-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14


  native-mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: ${{ github.workspace }}/.ci-avd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install emulator runtime
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0' 'emulator' 'system-images;android-35;default;x86_64'
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n solvia-ci -k 'system-images;android-35;default;x86_64' --device pixel_5 --force
          "$AVDMANAGER" list avd
          "$ANDROID_HOME/emulator/emulator" -list-avds
          sudo chmod 666 /dev/kvm
      - name: Build instrumentation APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Exercise native documents, forms, PDF and encrypted drafts
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p out/mobile-previews
          "$ANDROID_HOME/emulator/emulator" -avd solvia-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot >out/emulator.log 2>&1 &
          timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 150); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell wm size 720x1280
          adb shell wm density 320
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install android/app/build/outputs/apk/debug/app-debug.apk
          adb install android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 360 adb shell am instrument -w com.quremed.solvia.test.test/androidx.test.runner.AndroidJUnitRunner | tee out/native-tests.log
          grep -Eq 'OK \([0-9]+ tests?\)' out/native-tests.log
          adb pull /sdcard/Android/data/com.quremed.solvia.test/files/previews out/mobile-previews || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SOLVIA-2.5.0-native-mobile-checks
          path: out/
          retention-days: 14

