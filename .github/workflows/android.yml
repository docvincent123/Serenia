name: SOLVIA Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: solvia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOLVIA_ANDROID_KEYSTORE_BASE64: ${{ secrets.SOLVIA_ANDROID_KEYSTORE_BASE64 }}
      SOLVIA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SOLVIA_ANDROID_KEYSTORE_PASSWORD }}
      SOLVIA_ANDROID_KEY_ALIAS: ${{ secrets.SOLVIA_ANDROID_KEY_ALIAS }}
      SOLVIA_ANDROID_KEY_PASSWORD: ${{ secrets.SOLVIA_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Verify HTTPS only Android enrollment and network config
        run: python3 tests/mobile-security-config.py
      - name: Build SOLVIA test APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: SOLVIA-2.2.0-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: SOLVIA-2.2.0-Android-lint
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore



      - name: Build consistently signed production APK
        if: github.event_name != 'pull_request' && env.SOLVIA_ANDROID_KEYSTORE_BASE64 != ''
        shell: bash
        working-directory: android
        run: |
          umask 077
          signing_file="$RUNNER_TEMP/solvia-production.jks"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$SOLVIA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          export SOLVIA_ANDROID_KEYSTORE_PATH="$signing_file"
          gradle --no-daemon :app:assembleRelease :app:lintRelease
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && env.SOLVIA_ANDROID_KEYSTORE_BASE64 != ''
        with:
          name: SOLVIA-2.2.0-Android-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
