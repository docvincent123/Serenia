[package]
name = "solvia-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "SOLVIA One desktop shell for Linux and Windows"

[lib]
name = "solvia_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
