plugins { id 'com.android.application' }

android {
    namespace 'com.quremed.solvia'
    compileSdk 35

    defaultConfig {
        applicationId 'com.quremed.solvia'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
    }
}

