plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.quremed.solvia'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.quremed.solvia'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '2.5.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        production {
            if (System.getenv('SOLVIA_ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('SOLVIA_ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('SOLVIA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SOLVIA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('SOLVIA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SOLVIA_ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.production
        }

        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
    }
}


def solviaBrandSource = rootProject.file('../assets/solvia-icon.png.b64')
def solviaBrandTarget = file('src/main/res/drawable/solvia_icon.png')

tasks.register('materializeSolviaBrand') {
    inputs.file(solviaBrandSource)
    outputs.file(solviaBrandTarget)
    doLast {
        solviaBrandTarget.parentFile.mkdirs()
        solviaBrandTarget.bytes = solviaBrandSource.text.trim().decodeBase64()
    }
}
tasks.named('preBuild').configure { dependsOn('materializeSolviaBrand') }



dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
